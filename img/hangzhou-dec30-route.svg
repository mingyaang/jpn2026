<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 700" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif">
  <title>Dec 30 Hangzhou route: hotel, Hubin Pier, boat to Maojiabu, Lingyin, Faxi, Meijiawu, Leifeng, hotel, Wulin Night Market</title>
  <rect width="640" height="700" fill="#16161b"/>
  <!-- tea hills -->
  <ellipse cx="120" cy="520" rx="120" ry="200" fill="#9fcf5f" fill-opacity="0.10"/>
  <text x="30" y="560" font-size="13" fill="#898781">tea hills</text>
  <!-- West Lake -->
  <path d="M330 165 C 380 140, 470 145, 505 175 C 520 230, 515 330, 500 395 C 480 440, 400 445, 345 425 C 315 380, 305 260, 330 165 Z" fill="#68b6d6" fill-opacity="0.16" stroke="#68b6d6" stroke-opacity="0.4"/>
  <text x="420" y="300" font-size="15" fill="#68b6d6" text-anchor="middle" font-weight="600">West Lake</text>
  <line x1="378" y1="168" x2="392" y2="428" stroke="#898781" stroke-opacity="0.6" stroke-width="2"/>
  <text x="372" y="330" font-size="10" fill="#898781" transform="rotate(-87 372 330)">Su Causeway</text>
  <!-- from station -->
  <line x1="636" y1="20" x2="522" y2="89" stroke="#9fcf5f" stroke-width="2" stroke-dasharray="2 5"/>
  <text x="636" y="14" font-size="11" fill="#898781" text-anchor="end">from Hangzhou East Stn ↗</text>
  <!-- legs -->
  <line x1="522" y1="89" x2="495" y2="191" stroke="#c9c7c1" stroke-width="3" stroke-dasharray="2 6" stroke-linecap="round"/>
  <path d="M495 191 C 430 200, 330 230, 276 257" fill="none" stroke="#68b6d6" stroke-width="3" stroke-dasharray="9 6"/>
  <line x1="276" y1="257" x2="88" y2="319" stroke="#9fcf5f" stroke-width="3"/>
  <line x1="88" y1="319" x2="108" y2="405" stroke="#c9c7c1" stroke-width="3" stroke-dasharray="2 6" stroke-linecap="round"/>
  <line x1="108" y1="405" x2="94" y2="638" stroke="#9fcf5f" stroke-width="3"/>
  <path d="M94 638 C 220 600, 360 470, 414 393" fill="none" stroke="#9fcf5f" stroke-width="3"/>
  <path d="M414 393 C 560 330, 570 160, 522 89" fill="none" stroke="#9fcf5f" stroke-width="3"/>
  <line x1="522" y1="89" x2="512" y2="47" stroke="#c9c7c1" stroke-width="3" stroke-dasharray="2 6" stroke-linecap="round"/>
  <!-- stops -->
  <g font-size="13" font-weight="700" text-anchor="middle">
    <circle cx="522" cy="89" r="13" fill="#ffffff"/><text x="522" y="94" fill="#16161b">H</text>
    <circle cx="495" cy="191" r="13" fill="#9fcf5f"/><text x="495" y="196" fill="#16161b">1</text>
    <circle cx="276" cy="257" r="13" fill="#9fcf5f"/><text x="276" y="262" fill="#16161b">2</text>
    <circle cx="88" cy="319" r="13" fill="#9fcf5f"/><text x="88" y="324" fill="#16161b">3</text>
    <circle cx="108" cy="405" r="13" fill="#9fcf5f"/><text x="108" y="410" fill="#16161b">4</text>
    <circle cx="94" cy="638" r="13" fill="#9fcf5f"/><text x="94" y="643" fill="#16161b">5</text>
    <circle cx="414" cy="393" r="13" fill="#9fcf5f"/><text x="414" y="398" fill="#16161b">6</text>
    <circle cx="512" cy="47" r="13" fill="#9fcf5f"/><text x="512" y="52" fill="#16161b">7</text>
  </g>
  <g font-size="12" fill="#ffffff">
    <text x="540" y="94">Movietel (hotel)</text>
    <text x="513" y="196">Hubin Pier 湖滨码头</text>
    <text x="250" y="240" text-anchor="end">Maojiabu 茅家埠</text>
    <text x="106" y="314">Lingyin 灵隐寺</text>
    <text x="126" y="410">Faxi 法喜寺</text>
    <text x="112" y="643">Meijiawu 梅家坞</text>
    <text x="432" y="398">Leifeng 雷峰塔</text>
    <text x="494" y="42" text-anchor="end">Wulin Night Market 武林夜市</text>
  </g>
  <!-- legend -->
  <g font-size="11" fill="#898781">
    <line x1="420" y1="580" x2="450" y2="580" stroke="#9fcf5f" stroke-width="3"/><text x="458" y="584">Didi</text>
    <line x1="420" y1="602" x2="450" y2="602" stroke="#68b6d6" stroke-width="3" stroke-dasharray="9 6"/><text x="458" y="606">boat</text>
    <line x1="420" y1="624" x2="450" y2="624" stroke="#c9c7c1" stroke-width="3" stroke-dasharray="2 6" stroke-linecap="round"/><text x="458" y="628">walk</text>
    <text x="420" y="652">positions approximate</text>
    <text x="420" y="670">show drivers the Chinese names</text>
  </g>
</svg>
