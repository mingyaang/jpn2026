<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 700" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif">
  <title>Dec 27 Shanghai route: Rezen, home near Heping Park, Line 8 to China Art Museum station, walk to Shanghai Romance Park, back to China Art Museum, Line 8 and Line 10 to Yu Garden, Line 10 home</title>
  <rect width="640" height="700" fill="#16161b"/>
  <!-- Huangpu River -->
  <path d="M100 700 C 115 650, 125 615, 130 605 C 160 560, 195 535, 215 517 C 245 480, 262 455, 265 430 C 272 395, 278 370, 275 353 C 268 320, 255 300, 255 283 C 262 250, 275 232, 290 225 C 320 214, 345 213, 365 213 C 405 205, 440 160, 465 137 C 510 110, 555 92, 640 66" fill="none" stroke="#68b6d6" stroke-opacity="0.35" stroke-width="16" stroke-linecap="round"/>
  <text x="540" y="118" font-size="11" fill="#68b6d6" transform="rotate(-20 540 118)">Huangpu River</text>
  <g font-size="12" fill="#898781" font-weight="600" letter-spacing="2">
    <text x="40" y="150">PUXI</text>
    <text x="430" y="420">PUDONG</text>
  </g>
  <text x="318" y="262" font-size="10.5" fill="#898781">Lujiazui</text>
  <text x="236" y="262" font-size="10.5" fill="#898781" text-anchor="end">the Bund</text>
  <text x="150" y="300" font-size="10.5" fill="#898781" text-anchor="end">People’s Sq</text>
  <!-- legs -->
  <path d="M490 178 C 420 170, 320 150, 290 90" fill="none" stroke="#e8a87c" stroke-width="3"/>
  <line x1="190" y1="617" x2="240" y2="596" stroke="#c9c7c1" stroke-width="3" stroke-dasharray="2 6" stroke-linecap="round"/>
  <path d="M240 596 C 232 520, 215 460, 209 413" fill="none" stroke="#3fa9f5" stroke-width="3" stroke-dasharray="9 6"/>
  <line x1="209" y1="413" x2="250" y2="358" stroke="#b48ce0" stroke-width="3" stroke-dasharray="9 6"/>
  <path d="M250 358 C 240 280, 250 170, 290 90" fill="none" stroke="#b48ce0" stroke-width="3" stroke-dasharray="9 6"/>
  <!-- leg times -->
  <g font-size="10.5" font-weight="600" text-anchor="middle">
    <rect x="372" y="146" width="76" height="18" rx="9" fill="#16161b" stroke="#e8a87c"/><text x="410" y="159" fill="#e8a87c">taxi ~20 min</text>
    <rect x="186" y="634" width="80" height="18" rx="9" fill="#16161b" stroke="#c9c7c1"/><text x="226" y="647" fill="#c9c7c1">walk ~15 min</text>
    <rect x="120" y="496" width="96" height="18" rx="9" fill="#16161b" stroke="#3fa9f5"/><text x="168" y="509" fill="#3fa9f5">Line 8 → Line 10</text>
    <rect x="160" y="186" width="92" height="18" rx="9" fill="#16161b" stroke="#b48ce0"/><text x="206" y="199" fill="#b48ce0">Line 10 ~15 min</text>
  </g>
  <!-- stops -->
  <circle cx="209" cy="413" r="6" fill="#3fa9f5"/>
  <g font-size="13" font-weight="700" text-anchor="middle">
    <circle cx="490" cy="178" r="11" fill="#898781"/><text x="490" y="183" fill="#16161b">R</text>
    <circle cx="290" cy="90" r="13" fill="#ffffff"/><text x="290" y="95" fill="#16161b">H</text>
    <circle cx="190" cy="617" r="13" fill="#e8a87c"/><text x="190" y="622" fill="#16161b">1</text>
    <circle cx="240" cy="596" r="13" fill="#e8a87c"/><text x="240" y="601" fill="#16161b">2</text>
    <circle cx="250" cy="358" r="13" fill="#e8a87c"/><text x="250" y="363" fill="#16161b">3</text>
  </g>
  <g font-size="12" fill="#ffffff">
    <text x="505" y="183">Rezen (check out)</text>
    <text x="308" y="88">Home · Heping Park 和平公园</text>
    <text x="308" y="103" font-size="11" fill="#c9c7c1">Siping Rd Stn 四平路 (Lines 8, 10)</text>
    <text x="172" y="622" text-anchor="end">Romance Park</text>
    <text x="172" y="637" text-anchor="end" font-size="11" fill="#c9c7c1">上海千古情</text>
    <text x="258" y="594">China Art Museum</text>
    <text x="258" y="609" font-size="11" fill="#c9c7c1">中华艺术宫 · Line 8 stn</text>
    <text x="232" y="350" text-anchor="end">Yu Garden 豫园</text>
    <text x="232" y="364" text-anchor="end" font-size="11" fill="#c9c7c1">dinner + bazaar at night</text>
    <text x="196" y="430" text-anchor="end" font-size="11" fill="#c9c7c1">Laoximen 老西门 (change)</text>
  </g>
  <!-- legend -->
  <g font-size="11" fill="#898781">
    <line x1="440" y1="540" x2="470" y2="540" stroke="#e8a87c" stroke-width="3"/><text x="478" y="544">taxi / Didi</text>
    <line x1="440" y1="562" x2="470" y2="562" stroke="#3fa9f5" stroke-width="3" stroke-dasharray="9 6"/><text x="478" y="566">Metro Line 8</text>
    <line x1="440" y1="584" x2="470" y2="584" stroke="#b48ce0" stroke-width="3" stroke-dasharray="9 6"/><text x="478" y="588">Metro Line 10</text>
    <line x1="440" y1="606" x2="470" y2="606" stroke="#c9c7c1" stroke-width="3" stroke-dasharray="2 6" stroke-linecap="round"/><text x="478" y="610">walk</text>
    <text x="440" y="630" fill="#3fa9f5">11:30 Line 8 H → 2, ~30 min</text>
    <text x="440" y="644" fill="#b48ce0">17:30 2 → 3, ~15-20 min</text>
    <text x="440" y="664">positions approximate</text>
    <text x="440" y="680">show drivers the Chinese names</text>
  </g>
</svg>
