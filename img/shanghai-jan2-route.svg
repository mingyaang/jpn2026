<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif">
  <title>Jan 2 Shanghai route (tentative): Line 10 from Siping Road to Nanjing Road East, Line 2 to Jing'an Temple, walk to the Gong Yan palace banquet, then back the same way</title>
  <rect width="640" height="400" fill="#16161b"/>
  <!-- Huangpu River -->
  <path d="M640 60 C 600 110, 575 170, 572 240 C 570 300, 580 350, 595 400" fill="none" stroke="#68b6d6" stroke-opacity="0.35" stroke-width="16" stroke-linecap="round"/>
  <text x="577" y="330" font-size="11" fill="#68b6d6" transform="rotate(-86 577 330)">Huangpu River</text>
  <g font-size="12" fill="#898781" font-weight="600" letter-spacing="2">
    <text x="40" y="330">PUXI</text>
  </g>
  <!-- legs -->
  <path d="M470 80 C 470 130, 455 170, 430 205" fill="none" stroke="#b48ce0" stroke-width="3" stroke-dasharray="9 6"/>
  <path d="M430 205 C 380 215, 320 222, 260 222 C 220 222, 190 226, 160 230" fill="none" stroke="#9fcf5f" stroke-width="3" stroke-dasharray="9 6"/>
  <line x1="160" y1="230" x2="150" y2="168" stroke="#c9c7c1" stroke-width="3" stroke-dasharray="2 6" stroke-linecap="round"/>
  <!-- leg times -->
  <g font-size="10.5" font-weight="600" text-anchor="middle">
    <rect x="474" y="128" width="96" height="18" rx="9" fill="#16161b" stroke="#b48ce0"/><text x="522" y="141" fill="#b48ce0">Line 10 ~15 min</text>
    <rect x="290" y="236" width="96" height="18" rx="9" fill="#16161b" stroke="#9fcf5f"/><text x="338" y="249" fill="#9fcf5f">Line 2, 3 stops</text>
    <rect x="58" y="190" width="80" height="18" rx="9" fill="#16161b" stroke="#c9c7c1"/><text x="98" y="203" fill="#c9c7c1">walk ~8 min</text>
  </g>
  <!-- stations -->
  <circle cx="470" cy="80" r="7" fill="#3fa9f5"/>
  <circle cx="430" cy="205" r="5" fill="#9fcf5f"/>
  <circle cx="345" cy="218" r="4" fill="#9fcf5f"/>
  <circle cx="250" cy="222" r="4" fill="#9fcf5f"/>
  <circle cx="160" cy="230" r="5" fill="#9fcf5f"/>
  <!-- stop -->
  <g font-size="13" font-weight="700" text-anchor="middle">
    <circle cx="150" cy="168" r="13" fill="#e8a87c"/><text x="150" y="173" fill="#16161b">1</text>
  </g>
  <g font-size="12" fill="#ffffff">
    <text x="456" y="78" text-anchor="end">Home · Siping Rd 四平路</text>
    <text x="456" y="92" font-size="11" fill="#c9c7c1" text-anchor="end">leave ~16:45</text>
    <text x="440" y="200" font-size="11" fill="#c9c7c1">Nanjing Rd E Stn</text>
    <text x="440" y="214" font-size="11" fill="#c9c7c1">change to Line 2</text>
    <text x="345" y="207" font-size="10.5" fill="#c9c7c1" text-anchor="middle">People’s Sq</text>
    <text x="250" y="210" font-size="10.5" fill="#c9c7c1" text-anchor="middle">W Nanjing Rd</text>
    <text x="160" y="252" text-anchor="middle">Jing’an Temple Stn 静安寺</text>
    <text x="160" y="266" font-size="11" fill="#c9c7c1" text-anchor="middle">exit 3 · the golden temple is by the station</text>
    <text x="172" y="160">Gong Yan 宫宴 · ~17:30</text>
    <text x="172" y="174" font-size="11" fill="#c9c7c1">北京西路1485号 · palace banquet, 2-2.5 h</text>
  </g>
  <!-- legend -->
  <g font-size="11" fill="#898781">
    <line x1="40" y1="350" x2="70" y2="350" stroke="#b48ce0" stroke-width="3" stroke-dasharray="9 6"/><text x="78" y="354">Metro Line 10</text>
    <line x1="40" y1="370" x2="70" y2="370" stroke="#9fcf5f" stroke-width="3" stroke-dasharray="9 6"/><text x="78" y="374">Metro Line 2</text>
    <line x1="40" y1="390" x2="70" y2="390" stroke="#c9c7c1" stroke-width="3" stroke-dasharray="2 6" stroke-linecap="round"/><text x="78" y="394">walk</text>
    <text x="250" y="340" fill="#c9c7c1">~20:00 home the same way, ~35 min · Didi ~25 min</text>
    <text x="250" y="370">positions approximate</text>
    <text x="250" y="386">show drivers the Chinese names</text>
  </g>
</svg>
