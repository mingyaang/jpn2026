    <rect x="370" y="146" width="80" height="18" rx="9" fill="#16161b" stroke="#c9c7c1"/><text x="410" y="159" fill="#c9c7c1">walk ~15 min</text>
    <rect x="410" y="250" width="80" height="18" rx="9" fill="#16161b" stroke="#c9c7c1"/><text x="450" y="263" fill="#c9c7c1">walk ~15 min</text>
